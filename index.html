---
layout: null
---
<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#dff1ec">
  <title>{{ site.title }}</title>
  <meta name="apple-mobile-web-app-title" content="Bottles">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" type="image/png" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

  <main id="app" class="screen">
    <header>
      <h1>🍼 {{ site.title }}</h1>
    </header>

    <section class="card countdown">
      <p class="label" id="next-label">Next bottle</p>
      <p class="big" id="countdown">--:--:--</p>
      <p class="sub" id="next-time"></p>
    </section>

    <section class="card">
      <form id="feed-form">
        <label for="feed-time">Feeding time</label>
        <div class="row">
          <input id="feed-time" type="time" required>
          <button type="button" id="now" class="secondary">Now</button>
        </div>
        <button type="submit">Log feeding</button>
      </form>
    </section>

    <section class="card">
      <h2>Today's schedule</h2>
      <ul id="schedule"></ul>
      <p id="empty" class="sub">Log the first feeding to see the schedule.</p>
    </section>

    <section class="card">
      <h2>Logged today</h2>
      <ul id="log"></ul>
      <button id="reset" class="link danger">Clear today</button>
    </section>
  </main>

  <script>
    window.BOTTLE_CONFIG = {
      intervalHours: {{ site.bottle.interval_hours | default: 3 }},
      cutoff: "{{ site.bottle.cutoff | default: '19:30' }}"
    };
  </script>
  <script src="{{ '/assets/app.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
